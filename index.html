<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hybrid Generator</title>
  </head>
  <body>
    <div id="app">
      <div id="canvas-holder"></div>
      <div id="sidebar">
        <div id="mode-tabs">
          <button data-mode="record" class="active">Record</button>
          <button data-mode="live">Live</button>
        </div>
        <div id="uploads">
          <label class="upload-label record-only">
            Audio
            <input id="upload-audio" type="file" accept="audio/*" />
          </label>
          <div id="audio-status" class="record-only" style="font-size:10px;color:#555;">No audio loaded</div>
          <div id="camera-status" class="live-only" style="font-size:10px;color:#555;">Camera off</div>
        </div>
        <div id="typo-list"></div>
        <div id="pane-holder"></div>
      </div>
    </div>
    <div id="timeline"></div>
    <input id="upload-project" type="file" accept=".hybridproject,application/json" style="display:none">
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
